<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veleda — Buy sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E9A867}a:hover{color:#F6C792}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0F0E; color: #EDE4D6; font-family: 'Manrope', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="position: relative; padding: 54px 20px 12px; display: flex; flex-direction: column; gap: 14px; opacity: 0.4">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <img src="/_blob/96468e90d60a7f7438090e58c7df6a2a" alt="Veleda" style="width: 34px; height: 34px; border-radius: 10px; object-fit: cover; object-position: 50% 38%">
        <span style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em">VELEDA</span>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #E9A867">100.00 <span style="color: #8E8577; font-weight: 500">USDC</span></div>
    </div>
    <h1 style="margin: 0; font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; text-align: center">When will Taylor Swift's<br>first child be born?</h1>
  </div>

  <div style="flex: 1; position: relative; padding: 8px 20px 0; display: flex; flex-direction: column; opacity: 0.4">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="24">
      <div style="display: flex; align-items: center; height: 9px">
        <div style="width: 46px; font-size: 10px; font-weight: 600; color: {{r.labelColor}}; white-space: nowrap">{{r.label}}</div>
        <div style="flex: 1; display: flex; justify-content: center">
          <div style="height: 6px; width: {{r.w}}%; background: {{r.bg}}; background-size: 3px 3px, 100% 100%; opacity: {{r.op}}"></div>
        </div>
        <div style="width: 46px"></div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #151816; border-top: 1px solid #2C2A24; border-radius: 26px 26px 0 0; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; box-shadow: 0 -16px 40px rgba(0,0,0,0.6)">
    <div style="position: relative; display: flex; flex-direction: column; gap: 16px">
    <div aria-hidden="true" style="position: absolute; left: -20px; right: -20px; top: -12px; bottom: -8px; overflow: hidden; pointer-events: none">
    <svg width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#C9803E" stroke-opacity="0.22" stroke-width="1" aria-hidden="true" style="position: absolute; right: -90px; top: -70px">
      <line x1="160" y1="160" x2="160" y2="0"></line><line x1="160" y1="160" x2="228" y2="12"></line><line x1="160" y1="160" x2="282" y2="52"></line><line x1="160" y1="160" x2="314" y2="112"></line><line x1="160" y1="160" x2="320" y2="160"></line><line x1="160" y1="160" x2="314" y2="208"></line><line x1="160" y1="160" x2="282" y2="268"></line><line x1="160" y1="160" x2="228" y2="308"></line><line x1="160" y1="160" x2="160" y2="320"></line><line x1="160" y1="160" x2="92" y2="308"></line><line x1="160" y1="160" x2="38" y2="268"></line><line x1="160" y1="160" x2="6" y2="208"></line><line x1="160" y1="160" x2="0" y2="160"></line><line x1="160" y1="160" x2="6" y2="112"></line><line x1="160" y1="160" x2="38" y2="52"></line><line x1="160" y1="160" x2="92" y2="12"></line>
    </svg>
    </div>
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A362E"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; font-weight: 600; color: #8E8577">14 Mar – 2 Apr 2028 · 20 days</div>
        <div style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 54px; line-height: 1; color: #F6C792">×15.8</div>
        <div style="font-size: 12px; color: #8E8577">Crowd odds 6.1% · payout after fees</div>
      </div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #8E8577">Stake (USDC)</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button style="height: 46px; border-radius: 14px; border: 1px solid #2E2B25; background: #1B1E1B; color: #EDE4D6; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600">5</button>
        <button style="height: 46px; border-radius: 14px; border: 1px solid #E9A867; background: #2A221A; color: #F6C792; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700">20</button>
        <button style="height: 46px; border-radius: 14px; border: 1px solid #2E2B25; background: #1B1E1B; color: #EDE4D6; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600">50</button>
        <button style="height: 46px; border-radius: 14px; border: 1px solid #2E2B25; background: #1B1E1B; color: #8E8577; font-family: 'Manrope', sans-serif; font-size: 14px">Other</button>
      </div>
    </div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; color: #BFB5A5">Wins if it lands</span>
        <span style="font-size: 24px; font-weight: 700; color: #EDE4D6">316.00 <span style="font-size: 14px; font-weight: 600; color: #8E8577">USDC</span></span>
      </div>
      <div style="font-size: 11px; color: #8E8577">316 shares · 3.5% fee included · cancels if price passes 6.4%</div>
    </div>
    <button style="position: relative; height: 56px; border-radius: 18px; border: 0; background: linear-gradient(180deg, #F2BE84 0%, #D08D4B 100%); color: #1A120A; font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; display: flex; align-items: center; justify-content: center; gap: 14px">
      <span>predict the future</span><span style="width: 1px; height: 18px; background: rgba(26,18,10,0.35)"></span><span>20 USDC</span>
    </button>
    <button style="position: relative; height: 44px; margin-top: -6px; border-radius: 14px; border: 1px solid #2E2B25; background: transparent; color: #EDE4D6; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9A867" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
      Share this window as a link
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = { 0: '9 Mar', 7: '16 Mar', 14: '23 Mar', 21: '30 Mar' };
    const stip = 'radial-gradient(circle, rgba(13,15,14,0.55) 0.7px, transparent 0.9px), linear-gradient(90deg, #7A4A22, #C48A50 30%, #E8B97E 50%, #C48A50 70%, #7A4A22)';
    const stipSel = 'radial-gradient(circle, rgba(13,15,14,0.35) 0.7px, transparent 0.9px), linear-gradient(90deg, #C48A50, #F0CB98 50%, #C48A50)';
    const rows = [];
    for (let i = 0; i < 24; i++) {
      const g = (c, s) => Math.exp(-Math.pow((i - c) / s, 2));
      const w = 16 + 66 * g(14, 9) + 7 * Math.sin(i * 2.1);
      const sel = i >= 5 && i <= 24;
      rows.push({
        label: labels[i] || '',
        labelColor: sel ? '#F6C792' : '#5F5A50',
        w: Math.max(8, Math.min(90, w)).toFixed(1),
        bg: sel ? stipSel : stip,
        op: sel ? 1 : 0.5
      });
    }
    return { rows };
  }
}
</script>
</body>
</html>
