[package]
name = "veleda"
version = "0.1.0"
description = "Veleda on-chain program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veleda"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.2.1"
bytemuck = "1"
veleda-math = { path = "../../crates/veleda-math" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.18.0"
litesvm-token = { version = "0.18.0", features = ["token-2022"] }
solana-address = "2"
solana-clock = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-transaction = "4"
